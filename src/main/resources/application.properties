# Log level configuration
logging.level.org.springframework.web=INFO
logging.level.com.estadisticas=DEBUG

# Define el archivo donde se van a  guardar y la ruta
logging.file.name=logs/estadisticas_app.log

# Define log pattern (es opcional)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

#Cuando el archivo alcance 10 MB, se creara un nuevo archivo.
logging.logback.rollingpolicy.max-file-size=10MB

#Se mantendran los logs de los ultimos 7 o rotaciones para que puedan irse depiurando.
logging.logback.rollingpolicy.max-history=7

